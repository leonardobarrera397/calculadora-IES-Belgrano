<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <main>
        <h1 class="titulo">Trabajo práctico: Prácticas Profesionalizantes - IES Manuel Belgrano</h1>

        <section class="container" aria-labelledby="subtitulo">
            <h2 class="subtitulo" id="subtitulo">Calculadora</h2>

            <div class="inputs">
                <input type="text" id="campoAuxiliar" aria-label="Operación en curso" readonly>
                <input type="text" id="campoPrincipal" aria-label="Número actual o resultado" readonly>
            </div>

            <p class="mensaje-error" id="mensajeError" role="alert" hidden></p>

            <div class="buttonsContainer">
                <div class="buttonGroup">
                    <button type="button" class="numero">7</button>
                    <button type="button" class="numero">8</button>
                    <button type="button" class="numero">9</button>
                    <button type="button" class="funcion" id="limpiar" aria-label="Limpiar">C</button>
                </div>
                <div class="buttonGroup">
                    <button type="button" class="numero">4</button>
                    <button type="button" class="numero">5</button>
                    <button type="button" class="numero">6</button>
                    <button type="button" class="funcion" aria-label="Dividir">/</button>
                </div>
                <div class="buttonGroup">
                    <button type="button" class="numero">1</button>
                    <button type="button" class="numero">2</button>
                    <button type="button" class="numero">3</button>
                    <button type="button" class="funcion" aria-label="Multiplicar">*</button>
                </div>
                <div class="buttonGroup">
                    <button type="button" class="numero">0</button>
                    <button type="button" class="numero" aria-label="Punto decimal">.</button>
                    <button type="button" class="funcion" aria-label="Restar">-</button>
                    <button type="button" class="funcion" aria-label="Sumar">+</button>
                </div>
                <div class="buttonGroup">
                    <button type="button" class="funcion igual" id="igual" aria-label="Igual">=</button>
                </div>
            </div>
        </section>
    </main>

    <script src="js/calculadora.js"></script>
</body>
</html>
