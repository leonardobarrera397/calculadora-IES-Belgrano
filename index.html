<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <h1 class="titulo" id="titulo">Trabajo practico practicas profesionalizantes IES Manuel Belgrano</h1>
    <h2 class="subtitulo" id="subtitulo">Calculadora</h2>
    <div class="container">
        <div class="inputs">
            <input type="text" name="campoAuxiliar" id="campoAuxiliar">
            <input type="text" name="campoPrincipal" id="campoPrincipal" readonly>
        </div>
        <div class="buttonsContainer">
            <div class="buttonGroup"> 
                <button class="numero" id="boton7">7</button>
                <button class="numero" id="boton8">8</button>
                <button class="numero" id="boton9">9</button>
                 <button class="funcion" id="limpiar">C</button>
            </div>
            <div class="buttonGroup">
                <button class="numero" id="boton4">4</button>
                <button class="numero" id="boton5">5</button>
                <button class="numero" id="boton6">6</button>
                <button class="funcion" id="dividir">/</button>
            </div>
            <div class="buttonGroup">
                <button class="numero" id="boton1">1</button>
                <button class="numero" id="boton2">2</button>
                <button class="numero" id="boton3">3</button>
                <button class="funcion" id="multiplicar">*</button>
            </div>
            <div class="buttonGroup">
                <button class="numero" id="boton0">0</button>
                <button class="funcion" id="igual">=</button>
                <button class="funcion" id="restar">-</button>
                <button class="funcion" id="sumar">+</button>
            </div>
        </div>
    </div>
    
   


    <script src="js/calculadora.js"></script>
</body>
</html>
